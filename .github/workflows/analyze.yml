# Fast feedback on any branch: does it compile, and do the tests pass?
#
# The release workflow needs the signing keystore and takes about ten minutes.
# This needs no secrets and finishes in about two, so a branch can be checked
# before asking for an APK.

name: Analyze

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"

      - name: Get dependencies
        run: flutter pub get

      # Errors gate; warnings and lints do not. The project has never been
      # analysed in CI and has pre-existing findings unrelated to any given
      # branch, but an actual error -- an undefined name, a bad signature --
      # means the code cannot compile and there is no reason to let it through.
      #
      # This was continue-on-error, which reports the step as green even when
      # it fails, and it duly hid a removed-API error until the web build
      # tripped over it minutes later.
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      # This one does gate. A compile error is unambiguous, and the existing
      # widget tests are the only automated check the app side has.
      - name: Test
        run: flutter test

      # The web build is the only check that the browser target actually
      # compiles: dart:io is legal on Android and fatal here, so nothing else
      # catches a stray import. Roughly two minutes, and no secrets needed.
      - name: Build web
        run: flutter build web --release -t lib/main_web.dart

      # The deployable artifact. The server serves this rather than building
      # it: compiling Flutter needs gigabytes of disk that a NAS should not
      # have to give up for a few megabytes of static files.
      - name: Upload browser app
        uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: build/web
          if-no-files-found: error

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: server/backend
        run: pip install -r requirements-dev.txt

      - name: Test sync server
        working-directory: server/backend
        run: python -m pytest tests/ -q
