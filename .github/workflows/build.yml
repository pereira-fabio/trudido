name: Build Signed Release Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Must satisfy the floor recorded in pubspec.lock, currently
      # flutter >=3.44.0 / dart >=3.12.0 (flutter_quill 11.5.1 sets it). This
      # was pinned to 3.35.7, which ships Dart 3.9.2 and could not resolve the
      # dependency set at all.
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"

      # Fail in seconds rather than seven minutes in. Without these, the
      # keystore file is decoded from an empty string and the build dies at
      # signing with "Tag number over 30 is not supported", which says nothing
      # about the actual cause.
      - name: Check signing secrets are configured
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ]   || missing="$missing KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing KEYSTORE_PASSWORD"
          [ -n "$KEY_PASSWORD" ]      || missing="$missing KEY_PASSWORD"
          [ -n "$KEY_ALIAS" ]         || missing="$missing KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "::error::Add them under Settings -> Secrets and variables -> Actions."
            echo "::error::See docs/building.md for generating a keystore and filling these in."
            exit 1
          fi
          echo "All four signing secrets are present."

      - name: Restore keystore
        run: |
          mkdir -p $HOME/Documents/keystores
          echo "$KEYSTORE_BASE64" | base64 --decode > $HOME/Documents/keystores/trudido-release-key.jks
          echo "TRUDIDO_KEYSTORE=$HOME/Documents/keystores/trudido-release-key.jks" >> $GITHUB_ENV
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Get dependencies
        run: flutter pub get

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # PlayStore build - AAB without donations
      - name: Build PlayStore AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: flutter build appbundle --release --flavor playstore --obfuscate --split-debug-info=build/app/outputs/symbols-playstore

      - name: Rename PlayStore AAB with version
        run: |
          mv build/app/outputs/bundle/playstoreRelease/app-playstore-release.aab build/app/outputs/bundle/playstoreRelease/trudido-playstore-$VERSION.aab
        env:
          VERSION: ${{ env.VERSION }}

      # FDroid build - APK with donations enabled
      - name: Build FDroid universal APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: flutter build apk --release --flavor fdroid --dart-define=IS_FDROID=true --obfuscate --split-debug-info=build/app/outputs/symbols-fdroid

      - name: Rename FDroid APK with version
        run: |
          mv build/app/outputs/flutter-apk/app-fdroid-release.apk build/app/outputs/flutter-apk/trudido-fdroid-$VERSION.apk
        env:
          VERSION: ${{ env.VERSION }}

      # FDroid ARM64 build for F-Droid submission
      - name: Build FDroid ARM64 APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: flutter build apk --release --flavor fdroid --dart-define=IS_FDROID=true --target-platform=android-arm64 --obfuscate --split-debug-info=build/app/outputs/symbols-fdroid-arm64

      - name: Rename FDroid ARM64 APK with version
        run: |
          mv build/app/outputs/flutter-apk/app-fdroid-release.apk build/app/outputs/flutter-apk/trudido-fdroid-arm64-$VERSION.apk
        env:
          VERSION: ${{ env.VERSION }}

      - name: Upload PlayStore AAB
        uses: actions/upload-artifact@v4
        with:
          name: playstore-aab-${{ env.VERSION }}
          path: build/app/outputs/bundle/playstoreRelease/trudido-playstore-*.aab

      - name: Upload FDroid APKs
        uses: actions/upload-artifact@v4
        with:
          name: fdroid-apks-${{ env.VERSION }}
          path: build/app/outputs/flutter-apk/trudido-fdroid*.apk
