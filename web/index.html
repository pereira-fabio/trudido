<!DOCTYPE html>
<html>
<head>
  <!--
    Rewritten by `flutter build web` to whatever --base-href says. Left as the
    token so the build can be served from a subpath as well as from the root.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Simple tasks. Secure notes. Self-hosted.">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Trudido">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Trudido</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Shown until Flutter paints its first frame. Without it the page is a
       blank white rectangle for several seconds while the engine loads, which
       reads as a broken server rather than a loading app. */
    body {
      margin: 0;
      background: #faf9f7;
      color: #4a4a4a;
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1a1a; color: #b0b0b0; }
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }
    #loading img { width: 72px; height: 72px; border-radius: 16px; }
    #loading .bar {
      width: 160px; height: 3px; border-radius: 2px;
      background: rgba(128, 128, 128, 0.2); overflow: hidden;
    }
    #loading .bar span {
      display: block; width: 40%; height: 100%; border-radius: 2px;
      background: currentColor; opacity: 0.5;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"><span></span></div>
  </div>

  <script>
    // Removed once Flutter has painted, so the placeholder never sits on top
    // of the running app.
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
