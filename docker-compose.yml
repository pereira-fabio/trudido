# Trudido self-hosted sync.
#
#   docker compose up -d --build
#
# Sync API and Swagger docs   http://<server>:8001/docs
# Browser app                 http://<server>:8080
#
# Host ports are overridable, because a NAS running more than one of these
# stacks will collide -- peakpace's backend also publishes 8000. Put
# TRUDIDO_API_PORT / TRUDIDO_WEB_PORT in a .env file beside this one to
# change them. Only the host side moves; the container still listens on 8000.
#
# The phone app keeps working with this stack switched off; it is a sync peer,
# not a source of truth.

services:
  backend:
    build:
      context: ./server/backend
      dockerfile: Dockerfile
    container_name: trudido-backend
    restart: unless-stopped
    environment:
      - PROJECT_NAME=Trudido Sync
      # Everything lives here as plain files: records, attachments, index.
      # Point the volume below at wherever you want that to be.
      - DATA_DIR=/data
      # Empty leaves sync open, which is fine on an isolated home network.
      # Set this to any value to require it, and enter the same value in the
      # app under Settings -> Sync.
      - API_AUTH_TOKEN=
      # Largest single note attachment, in megabytes. Video notes are the
      # reason this is not smaller.
      - MAX_BLOB_MB=256
    volumes:
      # One mount, because there is no database needing local disk any more.
      # Records are individual JSON files written temp-then-rename, which is
      # atomic on CIFS and NFS, so the whole store is safe on a share.
      #
      # Local directory (the default -- works anywhere, nothing to set up):
      - ./data:/data
      #
      # Or straight onto the NAS. Mount the share on the host and bind it:
      #   //192.168.178.59/bigboy  ->  /mnt/bigboy
      # then swap the line above for:
      # - /mnt/bigboy/trudido:/data
      #
      # Use the IP, not truenas.local: mDNS names generally do not resolve
      # inside containers even where they work on the host.
    ports:
      - "${TRUDIDO_API_PORT:-8001}:8000"

  # The browser app: nginx serving a prebuilt bundle from ./web-build, with
  # /api proxied to the backend so it is all one origin and no CORS applies.
  # The bundle comes from CI (the web-app artifact) or from scripts/build-web.sh
  # on a machine that has Flutter -- this server never compiles it.
  web:
    build:
      context: .
      dockerfile: server/web/Dockerfile
    container_name: trudido-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${TRUDIDO_WEB_PORT:-8080}:80"

