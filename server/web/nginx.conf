server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter web ships a few large files; compressing them matters more than
    # the CPU it costs on a home server.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;
    gzip_min_length 1024;

    # The API is proxied under the same origin as the app. That means the
    # browser build needs no CORS at all, and the address to enter in the app
    # is simply the address of this page.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Attachments can be large and a home NAS is not always quick.
        client_max_body_size 512M;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Hashed build output never changes under the same name.
    location ~* \.(?:js|wasm|png|jpg|jpeg|svg|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html must not be cached, or a browser keeps loading the old build
    # after a redeploy and silently runs stale code against a new API.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
